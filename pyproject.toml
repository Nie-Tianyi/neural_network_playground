[project]
name = "neural-network-playground"
version = "0.1.0"
description = "Visualize PyTorch network training in the browser, TensorFlow-Playground style"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
]

# Windows/Linux 上 PyPI 的默认 torch wheel 是 CUDA 版（约 2.5G）。
# 这个项目的模型只有几十个参数，却要每帧跑上万格点的前向，
# GPU 的 kernel launch + 每步强制同步开销远超计算本身，CPU 反而更快。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17",
]

[tool.pyright]
# VS Code 的 Pylance 直接读这一段（它同时也读 pyrightconfig.json）。
# 显式钉住，免得不同版本、不同机器上的默认值不一样。
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["playground", "main.py"]

# tests/ 不参与类型检查。
#
# 原因：测试天然要去碰内部（`engine.model.net[0].weight`）、故意构造坏对象、
# 在多态的 EdgePayload 上取某个具体分支才有的字段。而 `Engine.model` /
# `Engine.cfg` 在 configure() 之前确实是 None，于是这类地方会产出几十条
# "可能为 None"、"联合类型上没有这个属性" 的噪音 —— 没有一条是真错误，
# 而且真有错的话跑一遍 pytest 就暴露了。
#
# playground/ 生产代码是**零 pyright 报错**的，这条底线由 CI/本地跑
# `npx pyright` 保证。
exclude = ["tests", ".venv", "**/__pycache__"]

[tool.pytest.ini_options]
# 这个项目不打包发布（`uv run main.py` 直接从仓库根目录跑），
# 所以让 pytest 把根目录加进 sys.path 就行，不需要装成 package。
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# 显式列出来，不依赖 ruff 的默认集 —— 默认集随版本变，钉住才能保证
# "本地跑是绿的"和"以后跑还是绿的"是同一件事。
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B", "BLE",  # flake8-bugbear / blind-except
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF", "PLR", "PYI",
    "S",         # bandit
]

ignore = [
    # 中文注释里的全角标点（，、：（））会被当成"歧义 Unicode 字符"。
    # 这是语言本身，不是问题。三条规则加起来误报一千多处。
    "RUF001", "RUF002", "RUF003",
    # assert 是这个项目表达内部不变量的主要方式（比如"网格点数
    # 必须等于 density²"），不是用来做输入校验的。
    "S101",
    # 魔数正是重点：datasets.py / palette.js 里那些常量全部来自
    # TensorFlow Playground 源码，注释里标了出处。
    "PLR2004",
    # 数据生成用的伪随机，不是密码学用途。
    "S311",
    # KANLinear 那种层的超参本来就多，拆成 dataclass 只会更难读。
    "PLR0913", "PLR0917",
    # 行宽交给 line-length 管，这里不重复报。
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# models.py 是给用户抄的模板，里面大量注释掉的示例代码。
"playground/models.py" = ["E501"]
